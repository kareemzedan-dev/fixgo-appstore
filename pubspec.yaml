name: fixgo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  photo_view: ^0.15.0
  flutter_bloc: ^9.1.1
  connectivity_plus: ^7.0.0
  dio: ^5.9.0
  flutter_launcher_icons: ^0.14.4
  intl: ^0.20.0
  flutter_localization: ^0.3.3
  smooth_page_indicator: ^2.0.1
  flutter_svg: ^2.2.3
  firebase_core: ^4.2.1
  supabase_flutter: ^2.12.0
  either_dart: ^1.0.0
  injectable: ^2.1.5
  lottie: ^3.3.3
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  dots_indicator: ^4.0.1
  mime: ^2.0.0
  image_picker: ^1.2.1
  uuid: ^4.5.2
  shimmer: ^3.0.0
  auto_size_text: ^3.0.0
  shared_preferences: any
  get_it: any
  path_provider: ^2.1.5
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_sign_in: ^6.2.1
  firebase_messaging: ^16.2.0
  app_links: ^6.4.1
  flutter_rating_bar: ^4.0.1
  intl_phone_field: ^3.2.0
  pdf: ^3.11.3
  printing: ^5.14.2
  country_picker: ^2.0.27
  bidi: ^2.0.13
  arabic_reshaper: ^0.0.1
  go_router: ^17.2.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  firebase_app_check: ^0.4.3
  firebase_storage: ^13.3.0
  file_picker: ^11.0.2
  firebase_auth_platform_interface: any
  url_launcher: any
  google_maps_flutter: ^2.17.0
  flutter_local_notifications: ^21.0.0
  dotted_border: ^3.1.0
  equatable: ^2.0.8
  marquee: ^2.3.0
  firebase_auth_web: ^6.2.1
  crypto: ^3.0.7
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.3.3
  injectable_generator: ^2.3.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/lotties/

  fonts:
    - family: Alyamama
      fonts:
        - asset: assets/fonts/Alyamama-Light.ttf
          weight: 400
        - asset: assets/fonts/Alyamama-Regular.ttf
          weight: 500
        - asset: assets/fonts/Alyamama-Medium.ttf
          weight: 600
        - asset: assets/fonts/Alyamama-SemiBold.ttf
          weight: 700
        - asset: assets/fonts/Alyamama-Bold.ttf
          weight: 800
        - asset: assets/fonts/Alyamama-Black.ttf
          weight: 900
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_foreground: "assets/icons/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21
